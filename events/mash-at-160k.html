<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MASH | At 160K</title>
  <link rel="icon" type="image/svg+xml" href="../assets/mash_logo.svg">
  <link rel="shortcut icon" href="../assets/mash_logo.svg">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="event-detail-page">
  <header class="event-topbar">
    <a href="../index.html" class="logo" aria-label="MASH Home">
      <img src="../assets/mash_logo.svg" alt="MASH logo">
    </a>
    <a href="../all-events.html">All Events</a>
  </header>

  <main class="event-detail-layout">
    <section class="event-flyer-wrap reveal">
      <img class="event-flyer" src="../assets/arcade_party.PNG" alt="MASH at 160K flyer">
    </section>

    <section class="event-content">
      <p class="eyebrow reveal">MASH Event Detail</p>
      <h1 class="event-title reveal">MASH at 160K</h1>
      <p class="event-subtitle reveal">A late-night curation bridging local selectors and invited guests.</p>

      <article class="detail-card reveal">
        <p class="detail-label">Date &amp; Time</p>
        <p class="detail-value">Thursday, January 22nd, 2026, 22:00 - 02:00</p>
      </article>

      <article class="detail-card reveal">
        <p class="detail-label">Venue</p>
        <p class="detail-value">160K</p>
      </article>

      <article class="detail-card reveal">
        <p class="detail-label">Lineup</p>
        <ul class="stack-list">
          <li>MM9 b3b Merrie b3b Jaya Latina</li>
          <li>Taju</li>
          <li>Isthisanna (FR)</li>
          <li>Defne</li>
        </ul>
      </article>

      <article class="detail-card reveal">
        <p class="detail-label">Newsletter / Attendance</p>
        <div class="attendance-toggle">
          <button type="button" class="active">Newsletter</button>
          <button type="button">Attendance</button>
        </div>
      </article>

      <div class="reveal">
        <a class="rsvp-button" href="mailto:hello@mashcollective.com?subject=RSVP%20MASH%20at%20160K">RSVP</a>
      </div>
    </section>
  </main>
  <script src="../script.js"></script>
</body>
</html>
