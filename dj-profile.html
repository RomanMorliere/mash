<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MASH | DJ Profile</title>
  <meta name="description" content="DJ profile, SoundCloud, and MASH event history.">
  <link rel="icon" type="image/svg+xml" href="assets/mash_logo.svg">
  <link rel="shortcut icon" href="assets/mash_logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo" aria-label="MASH Home">
      <img src="assets/mash_logo.svg" alt="MASH logo">
    </a>
    <nav class="nav" id="nav-menu">
      <a href="index.html">Home</a>
      <a href="all-events.html">All Events</a>
      <a href="djs.html">Meet The DJs</a>
      <span class="nav-current">DJ Profile</span>
    </nav>
    <div class="lang-switch" aria-label="Language switch">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="nl">NL</button>
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-label="Open menu">Menu</button>
  </header>

  <main>
    <section class="hero small-hero">
      <p class="eyebrow">DJ Profile</p>
      <h1 id="dj-name">Artist</h1>
      <p class="hero-text" id="dj-tagline">MASH artist profile.</p>
      <a href="djs.html" class="btn btn-ghost">Back to DJs</a>
    </section>

    <section class="panel dj-profile-layout">
      <article class="dj-profile-card">
        <img id="dj-profile-image" src="" alt="DJ profile image">
        <div class="dj-meta">
          <p class="detail-label">SoundCloud</p>
          <div class="hero-actions">
            <a id="dj-soundcloud" class="btn btn-small" href="#" target="_blank" rel="noopener">Open SoundCloud</a>
          </div>
        </div>
        <p class="detail-label">Events with MASH</p>
        <ul class="stack-list compact-events" id="dj-events"></ul>

        <div class="sc-widget" id="sc-widget">
          <div class="sc-widget-head">
            <svg viewBox="0 0 640 512" xmlns="http://www.w3.org/2000/svg" class="sc-icon" aria-hidden="true">
              <path d="M537.6 226.6c-10.8 0-21.1 2.2-30.6 6.1-6.4-70.8-65.8-126.4-138.3-126.4-17.8 0-35 3.3-50.3 9.4-6.1 2.2-7.8 4.4-7.8 9.2v249.7c0 5 3.9 8.6 8.6 9.2h218.3c43.3 0 78.6-35 78.6-78.3.1-43.6-35.2-78.9-78.5-78.9z"></path>
            </svg>
            <p class="heading">Currently Playing</p>
            <div class="loading" aria-hidden="true">
              <div class="load"></div>
              <div class="load"></div>
              <div class="load"></div>
            </div>
          </div>
          <iframe
            id="dj-soundcloud-player"
            title="SoundCloud player"
            width="100%"
            height="150"
            scrolling="no"
            frameborder="no"
            allow="autoplay"
          ></iframe>
          <p id="dj-soundcloud-player-fallback" class="sc-fallback" hidden>SoundCloud comming soon</p>
        </div>
      </article>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>Set Gallery</h2>
        <p>Moments during DJ sets.</p>
      </div>
      <div class="dj-sets-grid" id="dj-set-gallery"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p><a href="djs.html">Back to DJs</a></p>
  </footer>
  <script src="i18n.js"></script>
  <script src="script.js"></script>
  <script src="dj-profile.js"></script>
</body>
</html>
